# ---------------------------------------------------------------------------
# Home page
# ---------------------------------------------------------------------------
home:
  summary: >
    **AID 2026**---A workshop to bring together researchers and industry
    practitioners in the field of AI and LLM-based systems. This workshop will be
    an in-person event at PRDC 2026, held on **2--4 December 2026** in
    **Hong Kong SAR**. The exact venue and the workshop day will be announced on
    this page.

  # Centred link below the title, e.g. a submission call
  cta:
    enabled: false
    text: "[click here to submit your manuscript]"
    url: ""

  about_heading: "About the workshop"
  about: |
    The AID 2026 workshop provides a forum for researchers and industry
    practitioners to present and discuss the latest advancements in ensuring the
    dependability of AI and LLM-based systems. As AI becomes integral to critical
    infrastructure, its reliability, security, and robustness are paramount.

    This workshop will bring together experts from the dependable computing and AI
    communities to address new challenges in building trustable AI systems. We
    welcome submissions that explore innovative solutions, case studies, and
    fundamental research in this rapidly evolving field.

  # Extra sections appended to the bottom of the home page
  extra_sections: []
  # - heading: "Registration"
  #   body: |
  #     Registration is handled through the main PRDC 2026 registration page.

# ---------------------------------------------------------------------------
# Topics of interest
# ---------------------------------------------------------------------------
topics:
  heading: "Topics of interest"
  lead: "We invite submissions on, but not limited to, the following topics:"
  items:
    - title: "AI-based Software Vulnerability Detection and Secure Code Generation"
      description: >
        Leveraging AI techniques (e.g., LLMs) to automatically identify
        vulnerabilities in software and to generate secure, robust code including
        patches.
    - title: "AI-based Attack Detection"
      description: >
        Using AI models for detecting attacks and anomalies, such as network
        intrusion, adversarial attacks, model stealing queries, and so on.
    - title: "LLM-based Rust Translation"
      description: >
        Exploring the use of LLMs to translate code into memory-safe languages
        like Rust to enhance system security and reliability.
    - title: "AI-based Attack/Defense Simulation"
      description: >
        (1) Graph-based simulation for attack and defense simulation with AI
        (attack/defense simulation methods with Deep learning, Q learning and
        Graph based learning). (2) Simulating adversarial attacks against AI
        systems and developing effective defense strategies.
    - title: "AI based Red Teaming"
      description: >
        Methodologies and practices for systematically testing and breaking AI
        models to uncover hidden flaws, biases, and safety risks.
    - title: "AI Model Attacks and Defenses"
      description: >
        Techniques to exploit vulnerabilities in AI models (e.g., adversarial,
        model stealing, data extraction attacks) and the ways to mitigate them.
    - title: "AI dependability, Reliability, and Safety"
      description: >
        Measures to ensure AI systems remain robust, fault-tolerant, and safe
        across diverse conditions.
    - title: "Responsible and Trustworthy AI"
      description: >
        Approaches to building AI that is transparent, fair, and accountable,
        addressing ethical concerns and fostering user and societal trust.
    - title: "XAI"
      description: >
        Methods and frameworks that provide transparency and interpretability of
        AI models, enabling users to understand, trust, and effectively validate
        AI-driven decisions.

# ---------------------------------------------------------------------------
# Submission guidelines
# ---------------------------------------------------------------------------
submission:
  heading: "Submission Guidelines"
  url: ""
  body: |
    The workshop invites submissions to two tracks.

    - **Regular Paper Track.** Completed research, presented as a full conference
      paper with a clear contribution and supporting evaluation.
    - **R&D Paper Track.** Research carried out under a funded research project
      and still in progress. Papers introduce the project's objectives and
      approach and report its interim findings, giving project teams a venue to
      present ongoing work and gather feedback before the project concludes.

    Papers in both tracks must meet the following requirements.

    - **Originality.** Original, unpublished, and not under review at another
      conference or journal.
    - **Length.** At most **6 pages**, including figures, tables, and references.
    - **Format.** The double-column
      [IEEE conference template](https://conferences.ieeeauthorcenter.ieee.org/write-your-paper/authoring-tools-and-templates/).
    - **Anonymity.** Reviewing is **double-blind**. Remove author names,
      affiliations, and any identifying information from the manuscript.
    - **Submission.** Through EasyChair. The link will be announced on this page.

    Accepted papers are expected to be presented in person at the workshop.
  publication_note: >
    Accepted papers from both tracks will be published by the IEEE Computer
    Society Press (EI indexed) as part of the PRDC 2026 proceedings.
  note: >
    Please ensure that your submission addresses the core theme of
    **AI Dependability** and is relevant to the PRDC community. We look forward
    to your contributions.

# ---------------------------------------------------------------------------
# Important dates. Filling in `previous` shows the pre-extension date struck through.
#   Both tracks currently share one schedule, so there is a single unnamed track
#   and `lead` says so. If the tracks ever diverge, give this track a `name`, add
#   a second one, and drop or reword `lead` -- each named track then renders as
#   its own subheading.
# ---------------------------------------------------------------------------
important_dates:
  heading: "Important Dates"
  lead: "Both the Regular Paper Track and the R&D Paper Track share the **same deadlines**:"
  tracks:
    - name: ""
      items:
