        - label: "Camera ready submission"
          date: "20 October 2026"
          previous: ""
          note: "(AoE)"
        - label: "Workshop date"
          date: "2--4 December 2026"
          previous: ""
          note: "(one day within the PRDC 2026 dates; the exact day will be announced)"

